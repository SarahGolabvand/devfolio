<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#40bafc"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="45"/>
    </filter>
    <!-- iOS-style squircle background -->
    <path id="squircle" d="M512 0
      C 150 0 0 150 0 512
      C 0 874 150 1024 512 1024
      C 874 1024 1024 874 1024 512
      C 1024 150 874 0 512 0 Z"/>
    <clipPath id="clip"><use href="#squircle"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="#070b14"/>
    <radialGradient id="bgglow" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#0e1a33" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>
    <rect width="1024" height="1024" fill="url(#bgglow)"/>
  </g>
  <use href="#squircle" fill="none" stroke="#1e293b" stroke-opacity="0.6" stroke-width="4"/>

  <!-- soft ambient glow behind brackets -->
  <g filter="url(#softglow)" opacity="0.55">
    <path d="M420 260 L200 512 L420 764" fill="none" stroke="#0ea5e9" stroke-width="90" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M604 260 L824 512 L604 764" fill="none" stroke="#0ea5e9" stroke-width="90" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- brackets with glow -->
  <g filter="url(#glow)" fill="none" stroke="url(#cyan)"
     stroke-width="82" stroke-linecap="round" stroke-linejoin="round">
    <path d="M424 264 L204 512 L424 760"/>
    <path d="M600 264 L820 512 L600 760"/>
  </g>
</svg>
