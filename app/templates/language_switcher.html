{% comment %} {% load i18n %}
{% get_current_language as CURRENT_LANGUAGE %}

<div class="inline-flex items-center rounded-xl border border-slate-200 bg-slate-100 p-1 dark:border-slate-700 dark:bg-slate-900" role="group" aria-label="{% translate 'Select language' %}">
  <form action="{% url 'set_language' %}" method="post">
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ request.get_full_path|default:'/' }}" />
    <input name="language" type="hidden" value="en" />
    <button
      type="submit"
      lang="en"
      class="rounded-lg px-2.5 py-1.5 text-xs font-extrabold transition {% if CURRENT_LANGUAGE|slice:':2' == 'en' %}bg-white text-slate-950 shadow-sm dark:bg-slate-700 dark:text-white{% else %}text-slate-500 hover:text-slate-950 dark:text-slate-400 dark:hover:text-white{% endif %}"
      {% if CURRENT_LANGUAGE|slice:":2" == "en" %}aria-current="true"{% endif %}
      aria-label="{% translate 'Switch to English' %}"
    >
      EN
    </button>
  </form>
  <form action="{% url 'set_language' %}" method="post">
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ request.get_full_path|default:'/' }}" />
    <input name="language" type="hidden" value="fa" />
    <button
      type="submit"
      lang="fa"
      class="rounded-lg px-2.5 py-1.5 text-xs font-extrabold transition {% if CURRENT_LANGUAGE|slice:':2' == 'fa' %}bg-white text-slate-950 shadow-sm dark:bg-slate-700 dark:text-white{% else %}text-slate-500 hover:text-slate-950 dark:text-slate-400 dark:hover:text-white{% endif %}"
      {% if CURRENT_LANGUAGE|slice:":2" == "fa" %}aria-current="true"{% endif %}
      aria-label="{% translate 'Switch to Persian' %}"
    >
      فا
    </button>
  </form>
</div> {% endcomment %}
