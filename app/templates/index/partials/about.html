{% load static %}{% load i18n %}
<section id="about" class="relative isolate overflow-hidden">
  <div
    class="absolute inset-x-0 top-0 -z-10 h-[32rem] bg-gradient-to-b from-brand-50 to-transparent dark:from-brand-500/10"
  ></div>

  <div
    class="absolute -right-24 top-20 -z-10 size-72 rounded-full bg-brand-400/10 blur-3xl"
  ></div>

  <div
    class="mx-auto grid min-h-[calc(100vh-73px)] max-w-7xl items-center gap-14 px-5 py-20 sm:px-8 lg:grid-cols-[1.1fr_.9fr] lg:px-10"
  >
    <!-- Left Column: Content -->
    <div>
      <div class="mb-10 inline-flex flex-wrap items-center gap-3">
        <div
          class="inline-flex items-center gap-2.5 text-xs font-bold uppercase tracking-[0.16em] text-emerald-700 dark:text-emerald-400"
        >
          <span class="relative flex size-2.5">
            <span
              class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"
            ></span>
            <span
              class="relative inline-flex size-2.5 rounded-full bg-emerald-500"
            ></span>
          </span>
          Available for selected projects
        </div>

        {% if profile.location %}
        <span class="text-slate-300 dark:text-slate-700">•</span>
        <div
          class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-500 dark:text-slate-400"
        >
          <svg
            class="size-3.5"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"
            />
          </svg>
          <span>{{ profile.location }}</span>
        </div>
        {% endif %}
      </div>

      <p class="mb-4 text-lg font-bold text-brand-600 dark:text-brand-400">
        Hello, I’m {{ profile.first_name }}.
      </p>

      <h1
        class="max-w-3xl text-5xl font-black leading-[1.05] tracking-[-0.045em] text-slate-950 sm:text-6xl lg:text-7xl dark:text-white"
      >
        {% trans "I build backend systems that" %}
        <span class="text-brand-600 dark:text-brand-400"
          >{% trans 'scale with confidence.' %}</span
        >
      </h1>

      <p
        class="mt-7 max-w-2xl text-lg leading-8 text-slate-600 dark:text-slate-300"
      >
        {{ profile.bio }}
      </p>

      <div class="mt-3 pt-3 dark:border-slate-800/80">
        <div class="flex items-center gap-3">
          <!-- GitHub -->
          <a
            href="{{profile.links.github}}"
            target="_blank"
            rel="noreferrer"
            aria-label="GitHub"
            class="grid size-9 place-items-center rounded-full border border-slate-300 bg-slate-100 text-slate-700 shadow-sm transition hover:-translate-y-0.5 hover:border-slate-900 hover:bg-slate-900 hover:text-white dark:border-slate-800 dark:bg-slate-900 dark:text-slate-300 dark:hover:border-slate-700 dark:hover:bg-slate-800 dark:hover:text-white"
          >
            <svg class="size-4 fill-current" viewBox="0 0 24 24">
              <path
                d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"
              />
            </svg>
          </a>

          <!-- LinkedIn -->
          <a
            href="{{profile.links.linkedin}}"
            target="_blank"
            rel="noreferrer"
            aria-label="LinkedIn"
            class="grid size-9 place-items-center rounded-full border border-slate-300 bg-slate-100 text-slate-700 shadow-sm transition hover:-translate-y-0.5 hover:border-[#0A66C2] hover:bg-[#0A66C2] hover:text-white dark:border-slate-800 dark:bg-slate-900 dark:text-slate-300 dark:hover:border-[#0A66C2] dark:hover:bg-[#0A66C2] dark:hover:text-white"
          >
            <svg class="size-4 fill-current" viewBox="0 0 24 24">
              <path
                d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"
              />
            </svg>
          </a>
        </div>
      </div>

      <div class="mt-9 flex flex-col gap-3 sm:flex-row">
        <a
          href="#projects"
          class="inline-flex items-center justify-center gap-2 rounded-xl bg-slate-950 px-6 py-3.5 text-sm font-bold text-white shadow-xl shadow-slate-950/15 transition hover:-translate-y-0.5 hover:bg-brand-600 dark:bg-brand-600 dark:hover:bg-brand-500"
        >
          Explore my work
          <svg
            data-directional-icon
            class="size-4"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m9 18 6-6-6-6"
            />
          </svg>
        </a>
        <button
          type="button"
          data-open-order
          class="inline-flex items-center justify-center rounded-xl border border-slate-300 bg-white px-6 py-3.5 text-sm font-bold text-slate-800 transition hover:border-brand-300 hover:text-brand-700 dark:border-slate-700 dark:bg-slate-900 dark:text-white dark:hover:border-brand-500/50"
        >
          Start a conversation
        </button>
      </div>
    </div>

    <!-- Right Column: Avatar Card -->
    <div class="relative mx-auto w-full max-w-lg lg:justify-self-end">
      <!-- Glow effect behind card -->
      <div
        class="absolute -inset-5 -z-10 rotate-3 rounded-[2.5rem] bg-brand-500/10"
      ></div>

      <!-- Main Avatar Container -->
      <div
        class="relative aspect-[4/5] w-full overflow-hidden rounded-[2rem] border border-slate-200/80 bg-slate-100 shadow-xl dark:border-slate-800 dark:bg-slate-900"
      >
        <img
          src="{{ profile.avatar_url }}"
          alt="{{ profile.fullname }}"
          class="h-full w-full object-cover object-center"
        />

        <!-- Pattern overlay -->
        <div
          class="pointer-events-none absolute inset-0 opacity-20 dark:opacity-30"
          style="
            background-image: radial-gradient(
              circle at 1px 1px,
              rgb(100 116 139 / 0.4) 1px,
              transparent 0
            );
            background-size: 24px 24px;
          "
        ></div>

        <!-- Bottom gradient -->
        <div
          class="pointer-events-none absolute inset-0 bg-gradient-to-t from-slate-950/40 via-transparent to-transparent"
        ></div>
      </div>
    </div>
  </div>
</section>
