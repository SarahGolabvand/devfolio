<dialog
  id="contact-dialog"
  class="m-auto w-[calc(100%-2rem)] max-w-xl rounded-3xl bg-white p-0 text-slate-700 shadow-2xl dark:bg-slate-900 dark:text-slate-300"
>
  <div
    class="border-b border-slate-200 px-6 py-5 sm:px-8 dark:border-slate-800"
  >
    <div class="flex items-start justify-between gap-5">
      <div>
        <p
          class="text-xs font-black uppercase tracking-[0.16em] text-brand-600 dark:text-brand-400"
        >
          LEAVE A MESSAGE
        </p>
        <h2 class="mt-2 text-2xl font-black text-slate-950 dark:text-white">
          Got something to share?
        </h2>
      </div>
      <button
        type="button"
        data-close-order
        onclick="document.getElementById('contact-dialog').close()"
        class="grid size-9 shrink-0 place-items-center rounded-lg text-slate-500 transition hover:bg-slate-100 hover:text-slate-950 dark:hover:bg-slate-800 dark:hover:text-white"
        aria-label="Close inquiry form"
      >
        <svg
          class="size-5"
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>
    </div>
  </div>
  <form
    method="POST"
    action="{% url 'contact:submit' %}"
    id="contact-form"
    class="space-y-5 px-6 py-6 sm:px-8 sm:py-8"
  >
    {% csrf_token %}
    <div>
      <label
        for="name"
        class="mb-2 block text-sm font-bold text-slate-800 dark:text-slate-200"
        >Name</label
      >
      <input
        id="name"
        name="name"
        type="text"
        required
        autocomplete="name"
        placeholder="Your name"
        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-950 outline-none transition placeholder:text-slate-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 dark:border-slate-700 dark:bg-slate-950 dark:text-white"
      />
    </div>
    <div>
      <label
        for="email"
        class="mb-2 block text-sm font-bold text-slate-800 dark:text-slate-200"
        >Email</label
      >
      <input
        id="email"
        name="email"
        type="email"
        required
        autocomplete="email"
        placeholder="you@example.com"
        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-950 outline-none transition placeholder:text-slate-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 dark:border-slate-700 dark:bg-slate-950 dark:text-white"
      />
    </div>
    <div>
      <label
        for="subject"
        class="mb-2 block text-sm font-bold text-slate-800 dark:text-slate-200"
        >subject</label
      >
      <input
        id="subject"
        name="subject"
        type="text"
        required
        autocomplete="subject"
        placeholder="subject"
        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-950 outline-none transition placeholder:text-slate-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 dark:border-slate-700 dark:bg-slate-950 dark:text-white"
      />
    </div>
    <div>
      <label
        for="message"
        class="mb-2 block text-sm font-bold text-slate-800 dark:text-slate-200"
        >Message</label
      >
      <textarea
        id="message"
        name="message"
        rows="5"
        required
        placeholder="What’s on your mind?"
        class="w-full resize-none rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-950 outline-none transition placeholder:text-slate-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 dark:border-slate-700 dark:bg-slate-950 dark:text-white"
      ></textarea>
    </div>
    <button
      type="submit"
      class="w-full rounded-xl bg-brand-600 px-5 py-3.5 text-sm font-extrabold text-white transition hover:bg-brand-700 disabled:cursor-wait disabled:opacity-70 dark:hover:bg-brand-500"
    >
      Send message
    </button>
    <p class="text-center text-xs text-slate-500">
      I usually reply within 1–2 days.
    </p>
  </form>
</dialog>
