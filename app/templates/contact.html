<section id="contact" class="pb-24 pt-6">
  <div class="mx-auto max-w-7xl px-5 sm:px-8 lg:px-10">
    <div
      class="relative isolate overflow-hidden rounded-[2rem] border border-slate-200/80 bg-gradient-to-b from-white to-slate-50/80 px-6 py-14 text-center shadow-xl shadow-slate-200/50 transition-colors sm:px-12 sm:py-20 dark:border-slate-800/80 dark:bg-gradient-to-b dark:from-slate-900 dark:to-slate-950 dark:shadow-2xl dark:shadow-black/50"
    >
      <!-- Background Ambient Glow -->
      <div
        class="pointer-events-none absolute inset-0 -z-10 bg-[radial-gradient(circle_at_top_right,_rgba(14,165,233,0.15),_transparent_45%)] dark:bg-[radial-gradient(circle_at_top_right,_rgba(22,136,248,0.25),_transparent_40%)]"
      ></div>

      <!-- Badge / Pre-heading -->
      <p
        class="text-xs font-bold uppercase tracking-[0.2em] text-sky-600 sm:text-sm dark:text-sky-400"
      >
        Let’s build something useful
      </p>

      <!-- Main Heading -->
      <h2
        class="mx-auto mt-4 max-w-3xl text-3xl font-black tracking-tight text-slate-900 sm:text-5xl dark:text-white"
      >
        Looking for a partner in crime for your next experiment?
      </h2>

      <!-- Description -->
      <p
        class="mx-auto mt-5 max-w-2xl text-base leading-7 text-slate-600 sm:text-lg dark:text-slate-300"
      >
        If you have a weird idea or a big “what if,” I’d love to hear about it.
      </p>

      <!-- Actions Divider & Social Links -->
      <div
        class="mx-auto mt-10 max-w-sm border-t border-slate-200/90 pt-8 dark:border-slate-800"
      >
        <div class="flex items-center justify-center gap-6 sm:gap-8">
          <!-- Telegram -->
          <a
            href="{{profile.links.telegram}}"
            target="_blank"
            rel="noreferrer"
            class="group flex flex-col items-center gap-2 transition-transform duration-200 hover:-translate-y-1"
          >
            <span
              class="grid size-10 place-items-center rounded-full border border-slate-200 bg-white text-[#229ED9] shadow-sm transition-all group-hover:border-[#229ED9]/50 group-hover:bg-[#229ED9]/10 group-hover:shadow-md dark:border-slate-800 dark:bg-slate-900/90 dark:group-hover:border-[#229ED9]/40 dark:group-hover:bg-[#229ED9]/15"
            >
              <svg class="size-4.5 fill-current" viewBox="0 0 24 24">
                <path
                  d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"
                />
              </svg>
            </span>
            <span
              class="text-xs font-medium text-slate-600 transition-colors group-hover:text-slate-900 dark:text-slate-400 dark:group-hover:text-slate-100"
            >
              Telegram
            </span>
          </a>

          <!-- LinkedIn -->
          <a
            href="{{profile.links.linkedin}}"
            target="_blank"
            rel="noreferrer"
            class="group flex flex-col items-center gap-2 transition-transform duration-200 hover:-translate-y-1"
          >
            <span
              class="grid size-10 place-items-center rounded-full border border-slate-200 bg-white text-[#0A66C2] shadow-sm transition-all group-hover:border-[#0A66C2]/50 group-hover:bg-[#0A66C2]/10 group-hover:shadow-md dark:border-slate-800 dark:bg-slate-900/90 dark:text-[#0A66C2] dark:group-hover:border-[#0A66C2]/40 dark:group-hover:bg-[#0A66C2]/15"
            >
              <svg class="size-4.5 fill-current" viewBox="0 0 24 24">
                <path
                  d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"
                />
              </svg>
            </span>
            <span
              class="text-xs font-medium text-slate-600 transition-colors group-hover:text-slate-900 dark:text-slate-400 dark:group-hover:text-slate-100"
            >
              LinkedIn
            </span>
          </a>

          <!-- Email -->
          <a
            href="mailto:{{profile.links.email}}"
            class="group flex flex-col items-center gap-2 transition-transform duration-200 hover:-translate-y-1"
          >
            <span
              class="grid size-10 place-items-center rounded-full border border-slate-200 bg-white text-sky-600 shadow-sm transition-all group-hover:border-sky-500/50 group-hover:bg-sky-500/10 group-hover:shadow-md dark:border-slate-800 dark:bg-slate-900/90 dark:text-sky-400 dark:group-hover:border-sky-500/40 dark:group-hover:bg-sky-500/15"
            >
              <svg
                class="size-4.5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
            </span>
            <span
              class="text-xs font-medium text-slate-600 transition-colors group-hover:text-slate-900 dark:text-slate-400 dark:group-hover:text-slate-100"
            >
              Email
            </span>
          </a>

          <!-- SMS -->
          <a
            href="sms:{{profile.links.phone_number}}"
            class="group flex flex-col items-center gap-2 transition-transform duration-200 hover:-translate-y-1"
          >
            <span
              class="grid size-10 place-items-center rounded-full border border-slate-200 bg-white text-amber-600 shadow-sm transition-all group-hover:border-amber-500/50 group-hover:bg-amber-500/10 group-hover:shadow-md dark:border-slate-800 dark:bg-slate-900/90 dark:text-amber-400 dark:group-hover:border-amber-500/40 dark:group-hover:bg-amber-500/15"
            >
              <svg
                class="size-4.5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                />
                <line x1="8" y1="10" x2="16" y2="10" />
                <line x1="8" y1="14" x2="12" y2="14" />
              </svg>
            </span>
            <span
              class="text-xs font-medium text-slate-600 transition-colors group-hover:text-slate-900 dark:text-slate-400 dark:group-hover:text-slate-100"
            >
              SMS
            </span>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
